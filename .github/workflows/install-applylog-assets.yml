name: Install ApplyLog portfolio assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-applylog-assets.yml

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p videos posters
          curl --fail --location --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6d78-8246-82e0-a5d8d1c38540/raw?se=2026-10-12T10%3A20%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=1b12ba66-fbbd-57bc-b370-3fe334dd3bd9&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A08%3A23Z&ske=2026-10-13T01%3A08%3A23Z&sks=b&skv=2026-02-06&sig=wYuFR/1Nx6aOIEfpNw4ie5KG3tZpsgTPKVEBffoWod0%3D' --output videos/applylog.mp4
          curl --fail --location --retry 3 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-1098-81f8-bccc-b55c9def8004/raw?se=2026-10-12T10%3A20%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=1323c07b-4e24-5ee5-a12f-749037ab56ce&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A17%3A07Z&ske=2026-10-13T01%3A17%3A07Z&sks=b&skv=2026-02-06&sig=IrxE3V7AwzdjEnTKwlQTOj7PSqThCORoVOJ9EL0Tcbs%3D' --output posters/applylog.jpg
          curl --fail --location --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-db98-820e-8fdf-e1d2009a6965/raw?se=2026-10-12T10%3A20%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=bae67f3a-2c95-5409-9c26-61362bdd0fa5&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A17%3A40Z&ske=2026-10-13T01%3A17%3A40Z&sks=b&skv=2026-02-06&sig=VDH%2BadjrB9Oy5kETbIR3D9Z8Q/IvXHtBb7aWF3i0zPk%3D' --output Galiette-Mita-Resume.pdf
          test "$(wc -c < videos/applylog.mp4)" -gt 30000
          test "$(wc -c < posters/applylog.jpg)" -gt 30000
          test "$(wc -c < Galiette-Mita-Resume.pdf)" -gt 90000

      - name: Commit portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-applylog-assets.yml
          git add videos/applylog.mp4 posters/applylog.jpg Galiette-Mita-Resume.pdf
          git commit -m 'Add ApplyLog demo and AWS resume assets'
          git push
